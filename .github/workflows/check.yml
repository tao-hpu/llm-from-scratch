# 仓库自检:notebooks/ 与 README 表是否和脚本同步(tools/build_notebooks.py --check)。
# 只订 push,不订 pull_request,避免一次合并跑两条。检查只用标准库。
name: check
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_notebooks.py --check
